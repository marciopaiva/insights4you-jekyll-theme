# Welcome to Jekyll!

### Site Settings ###
title               : Insights4YOU
description         : >-                                                  # this means to ignore newlines until "baseurl:"
  Write an awesome description for your new site here. You can edit this
  line in _config.yml. It will appear in your document head meta (for
  Google search results) and in your feed.xml site description.
baseurl             : ""                                                  # Change to empty quotes if you are hosting your site at <your-username>.github.io directly
url                 : ""                                                  # the base hostname & protocol for your site, e.g. http://example.com
theme               : insights4you-jekyll-theme
keywords            : "your, keywords"
lang                : "en"
repository          : "marciopaiva/insights4you-jekyll-theme"             # NWO used by jekyll-github-metadata

### Theme Settings ###
markdown            : kramdown
layout-dark         : false
themeColor          : "#206bc4"
useIconfont         : false


### Author Info ###
author:
  name              : Marcio Paiva Barbosa
  bio               : Solution Architect
  image             : https://avatars.githubusercontent.com/u/1004306?v=4 # or use your avatar eg. assets/image/
  email             : mpaivabarbosa@gmail.com
  linkedin          : marcio-paiva-barbosa
  github            : marciopaiva
  github-sponsor    : marciopaiva

### Site Plugins ###
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate
  - jekyll-github-metadata


### Navbar Settings ###
nav_exclude:               # The following paths are excluded from navbar
  - pages/tags.html
  - pages/404.html

exclude:
  - logs
  - logs/build.log

### Collections ###
collections:
  projects:
    output: true
    permalink: /projects/:name

### Comments (Giscus - https://giscus.app) ###
# 1. Enable "Discussions" on this GitHub repo.
# 2. Install the giscus app: https://github.com/apps/giscus
# 3. Get repo_id/category_id from https://giscus.app and fill them below.
giscus:
  enabled: false
  repo: "marciopaiva/insights4you-jekyll-theme"
  repo_id: ""
  category: "Comments"
  category_id: ""
  mapping: "pathname"

### Defaults ###
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      layout-wrapper-full: true
      comments: true
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "default"

# Build Settings
sass:
  style: compressed # For production
  load_paths:
    - _sass
